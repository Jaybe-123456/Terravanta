services:
  - type: web
    name: terravanta-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_ORIGIN
        value: https://terravanta-five.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ENABLE_SYNTHETIC_DATA
        value: "false"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: EVIDENCE_STORAGE_BACKEND
        value: local
      - key: EVIDENCE_LOCAL_STORAGE_PERSISTENT
        value: "true"
      - key: EVIDENCE_MAX_FILE_BYTES
        value: "15000000"
      - key: EVIDENCE_SCANNER_HOST
        sync: false
      - key: EVIDENCE_SCANNER_PORT
        value: "3310"
      - key: EVIDENCE_SCANNER_TIMEOUT_SECONDS
        value: "8"
      - key: EVIDENCE_RETENTION_PURGE_ENABLED
        value: "false"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_CHAT_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      - key: NVIDIA_PARSE_MODEL
        value: nvidia/nemotron-3.5-parse
      - key: NVIDIA_PARSE_URL
        value: https://ai.api.nvidia.com/v1/retrieval/nvidia/nemotron-3.5-parse/parse
      - key: NVIDIA_PARSE_API_KEY
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: "35"
      - key: META_WA_SEND_ENABLED
        value: "false"
      - key: WHATSAPP_PAIRING_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_DATABASE_URL
        sync: false
      - key: META_WA_BUSINESS_NUMBER
        sync: false
      - key: META_WA_APP_SECRET
        sync: false
      - key: META_WA_VERIFY_TOKEN
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
    disk:
      name: terravanta-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: worker
    name: terravanta-workflow-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: python -m app.worker
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVICE_MODE
        value: worker
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_WORKER_DATABASE_URL
        sync: false
      - key: META_WA_SEND_ENABLED
        value: "false"
      - key: META_WA_ACCESS_TOKEN
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_GRAPH_API_VERSION
        sync: false
      - key: META_WA_NOTIFICATION_TEMPLATE
        sync: false
      - key: META_WA_TEMPLATE_LANGUAGE
        value: en
      - key: WORKFLOW_POLL_SECONDS
        value: "30"
      - key: ENABLE_SYNTHETIC_DATA
        value: "false"
