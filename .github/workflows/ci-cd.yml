name: Terravanta CI and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terravanta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: sqlite://
      DEMO_AUTH_SECRET: ci-only-test-secret-not-for-deployment
      ENABLE_SYNTHETIC_DATA: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  api-migrations:
    name: PostGIS migration check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://terravanta:ci-only-password@localhost:5432/terravanta
      DEMO_AUTH_SECRET: ci-only-test-secret-not-for-deployment
      ENABLE_SYNTHETIC_DATA: "false"
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: terravanta
          POSTGRES_USER: terravanta
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terravanta -d terravanta"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Apply all database migrations
        run: alembic upgrade head
      - name: Verify PostGIS and migration head
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          import os

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              assert connection.scalar(text("SELECT PostGIS_Version()"))
              applied = connection.scalar(text("SELECT version_num FROM alembic_version"))
          expected = ScriptDirectory.from_config(Config("alembic.ini")).get_current_head()
          assert applied == expected, f"Expected Alembic head {expected}, got {applied}"
          print(f"PostGIS is available; migration head is {applied}")
          PY

  web:
    name: Web checks and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_MODE: access_code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
