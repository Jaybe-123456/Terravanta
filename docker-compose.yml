services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terravanta
      POSTGRES_USER: terravanta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terravanta -d terravanta"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://terravanta:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/terravanta
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://terravanta-five.vercel.app}
      DEMO_AUTH_SECRET: ${DEMO_AUTH_SECRET:-local-demo-only-change-me}
      ENABLE_SYNTHETIC_DATA: ${ENABLE_SYNTHETIC_DATA:-false}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_CHAT_MODEL: ${NVIDIA_CHAT_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      NVIDIA_PARSE_MODEL: ${NVIDIA_PARSE_MODEL:-nvidia/nemotron-3.5-parse}
      NVIDIA_PARSE_URL: ${NVIDIA_PARSE_URL:-}
      NVIDIA_PARSE_API_KEY: ${NVIDIA_PARSE_API_KEY:-}
      UPLOADS_DIR: /app/data/uploads
      EVIDENCE_STORAGE_BACKEND: ${EVIDENCE_STORAGE_BACKEND:-local}
      EVIDENCE_LOCAL_STORAGE_PERSISTENT: ${EVIDENCE_LOCAL_STORAGE_PERSISTENT:-false}
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-}
      EVIDENCE_S3_REGION: ${EVIDENCE_S3_REGION:-us-east-1}
      EVIDENCE_S3_ENDPOINT_URL: ${EVIDENCE_S3_ENDPOINT_URL:-}
      EVIDENCE_S3_ACCESS_KEY: ${EVIDENCE_S3_ACCESS_KEY:-}
      EVIDENCE_S3_SECRET_KEY: ${EVIDENCE_S3_SECRET_KEY:-}
      EVIDENCE_MAX_FILE_BYTES: ${EVIDENCE_MAX_FILE_BYTES:-15000000}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-35}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - api_uploads:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_AUTH_MODE: ${NEXT_PUBLIC_AUTH_MODE:-supabase}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
