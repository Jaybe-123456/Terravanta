[project]
name = "terravanta-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.17.0",
    "boto3==1.42.36",
    "fastapi[standard]==0.165.0",
    "httpx==0.28.1",
    "psycopg[binary]==3.2.12",
    "pydantic-settings==2.11.0",
    "pyjwt[crypto]==2.10.1",
    "pypdf==6.1.3",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.44",
    "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"
